<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Resume Embed</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <main class="embed-page">

        <h1>
            Add Your GitHub Resume
        </h1>

        <p>
            Add this Markdown to your GitHub README
            to display your resume.
        </p>

        <div class="embed-preview">

            <img id="badge">

        </div>

        <div class="embed-code">

            <textarea id="markdown" readonly></textarea>

            <button id="copy-button">
                Copy Markdown
            </button>

        </div>

    </main>

    <script src="/embed.js"></script>

</body>

</html>
